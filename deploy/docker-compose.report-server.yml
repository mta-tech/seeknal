version: "3.8"

services:
  report-server:
    build:
      context: ./seeknal-src
      dockerfile: docker/report-server/Dockerfile
    container_name: seeknal-report-server
    restart: unless-stopped
    ports:
      # Bind to loopback by default; set SEEKNAL_REPORT_SERVER_BIND_ADDRESS=0.0.0.0 to expose on all interfaces deliberately
      - "${SEEKNAL_REPORT_SERVER_BIND_ADDRESS:-127.0.0.1}:8787:8787"
    volumes:
      - report-data:/data
    environment:
      - SEEKNAL_REPORT_SERVER_AUTH_MODE=${SEEKNAL_REPORT_SERVER_AUTH_MODE:-api_key}
      - SEEKNAL_REPORT_SERVER_KEYS=${SEEKNAL_REPORT_SERVER_KEYS:-}
      - SEEKNAL_REPORT_SERVER_MAX_UPLOAD_BYTES=${SEEKNAL_REPORT_SERVER_MAX_UPLOAD_BYTES:-104857600}
      - SEEKNAL_REPORT_SERVER_MAX_TAR_MEMBERS=${SEEKNAL_REPORT_SERVER_MAX_TAR_MEMBERS:-10000}
      - SEEKNAL_REPORT_SERVER_MAX_UNPACKED_BYTES=${SEEKNAL_REPORT_SERVER_MAX_UNPACKED_BYTES:-536870912}
      - SEEKNAL_REPORT_SERVER_MAX_PATH_DEPTH=${SEEKNAL_REPORT_SERVER_MAX_PATH_DEPTH:-32}
      - SEEKNAL_REPORT_SERVER_MAX_MEMBER_NAME_LENGTH=${SEEKNAL_REPORT_SERVER_MAX_MEMBER_NAME_LENGTH:-1024}
      - SEEKNAL_REPORT_SERVER_MAX_CONCURRENT_PUBLISHES=${SEEKNAL_REPORT_SERVER_MAX_CONCURRENT_PUBLISHES:-4}
      - SEEKNAL_REPORT_SERVER_CORS_ORIGINS=${SEEKNAL_REPORT_SERVER_CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  report-data:
